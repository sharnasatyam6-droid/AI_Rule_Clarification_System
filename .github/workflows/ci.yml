name: Rulebook CI
on:
  push:
    branches: [main, migration/html-css-js-fastapi]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q backend api
      - run: python -c "from backend.main import app; print(app.title)"
      - run: node --check public/assets/app.js
